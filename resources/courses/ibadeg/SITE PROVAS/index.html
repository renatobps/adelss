<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBADEG - Provas Interativas</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #2b2620;
    --muted: #6b6355;
    --accent: #7a3b2e;
    --accent-dark: #5c2b21;
    --ok: #2e7d4f;
    --err: #b3402f;
    --border: #e0d9c9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 18px 24px;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 900px;
    margin: 0 auto;
  }
  header h1 {
    font-size: 1.25rem;
    margin: 0;
    cursor: pointer;
  }
  header .subtitle {
    font-size: .8rem;
    opacity: .85;
    margin-top: 2px;
  }
  .home-link {
    color: #fff;
    text-decoration: none;
    font-size: .9rem;
    border: 1px solid rgba(255,255,255,.5);
    padding: 6px 12px;
    border-radius: 6px;
  }
  .home-link:hover { background: rgba(255,255,255,.15); }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }
  .intro {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .exam-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    cursor: pointer;
    transition: box-shadow .15s, transform .15s;
  }
  .exam-card:hover {
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
    transform: translateY(-2px);
  }
  .exam-card .num {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: .75rem;
    padding: 2px 8px;
    border-radius: 12px;
    margin-bottom: 8px;
  }
  .exam-card h3 {
    margin: 0 0 4px;
    font-size: 1.05rem;
  }
  .exam-card .meta {
    font-size: .8rem;
    color: var(--muted);
  }
  .exam-card .score-pill {
    float: right;
    font-size: .75rem;
    background: #e9f3ec;
    color: var(--ok);
    padding: 2px 8px;
    border-radius: 12px;
  }
  .quiz-header {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    margin-bottom: 20px;
  }
  .quiz-header h2 { margin: 0 0 4px; }
  .quiz-header .meta { color: var(--muted); font-size: .9rem; }
  .question {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .question .qnum {
    font-weight: bold;
    color: var(--accent);
    margin-right: 6px;
  }
  .question .instruction {
    margin-bottom: 12px;
  }
  .item-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px dashed var(--border);
  }
  .item-row:first-of-type { border-top: none; }
  .item-letter {
    font-weight: bold;
    min-width: 18px;
    color: var(--muted);
  }
  .item-text { flex: 1; }
  .ce-toggle { display: flex; gap: 6px; flex-shrink: 0; }
  .ce-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 4px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: .9rem;
    color: var(--muted);
  }
  .ce-btn.c-btn.selected { background: #e9f3ec; border-color: var(--ok); color: var(--ok); font-weight: bold; }
  .ce-btn.e-btn.selected { background: #fbeae7; border-color: var(--err); color: var(--err); font-weight: bold; }
  .single-options label, .match-options label {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 6px 0;
    cursor: pointer;
  }
  .fill-input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 1rem;
    margin-top: 4px;
  }
  .fill-part { margin-bottom: 10px; }
  .fill-part .prompt { margin-bottom: 4px; }
  select.match-select {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
  }
  .match-left {
    background: #faf8f3;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: .9rem;
  }
  .match-left div { padding: 2px 0; }
  .grading .item-row.correct { background: #f0f8f2; }
  .grading .item-row.incorrect { background: #fbeeec; }
  .grading .item-row { border-radius: 6px; padding: 8px 10px; margin: 4px 0; border-top: none; }
  .result-tag {
    font-size: .75rem;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
  }
  .result-tag.ok { background: #e9f3ec; color: var(--ok); }
  .result-tag.no { background: #fbeae7; color: var(--err); }
  .correct-answer-note {
    font-size: .85rem;
    color: var(--err);
    margin-top: 4px;
  }
  .uncertain-flag {
    font-size: .72rem;
    color: #a67c00;
    background: #fff6e0;
    border: 1px solid #f0dca0;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 6px;
  }
  .actions {
    position: sticky;
    bottom: 0;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    padding: 16px 0 8px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn.secondary {
    background: #fff;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .btn.secondary:hover { background: #f5ece9; }
  .score-banner {
    background: var(--card);
    border: 2px solid var(--accent);
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 20px;
    text-align: center;
  }
  .score-banner .big {
    font-size: 2.2rem;
    font-weight: bold;
    color: var(--accent);
  }
  .score-banner .pct { color: var(--muted); }
  .gabarito-title {
    text-align: center;
    margin: 30px 0 16px;
    color: var(--accent);
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: .8rem;
    padding: 20px;
  }
  .progress-note {
    font-size: .8rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <div>
      <h1 onclick="goHome()">IBADEG &mdash; Provas Interativas</h1>
      <div class="subtitle" id="header-subtitle">Instituto Educacional e Teológico do Gama</div>

</header>
<main id="app"></main>

"correct": "E"}, {"letter": "d", "text": "O Novo Testamento lembra os episódios da serpente de bronze (Jo 3.14s), da revolta de Coré (2Tm 2.19; Jd 11), de Balaão (2Pd 2.15s; Ap 2.14), a fidelidade de Moisés e a incompreensão do povo (Hb 3,2 – 4,7).", "correct": "C"}]}, {"n": 7, "type": "ce", "instruction": "Marque “C” para as alternativas corretas e “E” para as alternativas incorretas.", "parts": [{"letter": "a", "text": "A palavra “Sacerdote” significa “distanciar-se”.", "correct": "E"}, {"letter": "b", "text": "O Êxodo trata do período da história de Israel que vai desde a morte de José (Gn 50) até a construção do santuário junto ao monte Sinai.", "correct": "C"}, {"letter": "c", "text": "Melquisedeque é um dos personagens mais misteriosos da literatura bíblica.", "correct": "C"}, {"letter": "d", "text": "Somos chamados para sermos “um sacerdócio santo e para oferecermos sacrifícios espirituais agradáveis a Deus por Jesus Cristo” (1Pe 2.5)", "correct": "C"}]}, {"n": 8, "type": "ce", "instruction": "Marque “C” para as alternativas corretas e “E” para as alternativas incorretas.", "parts": [{"letter": "a", "text": "O segundo livro do Pentateuco se chama “Êxodo”, nome que em grego significa “chegada”, por se ocupar da chegada de Israel do Egito.", "correct": "E"}, {"letter": "b", "text": "O livro de Êxodo salienta a participação direta de Deus na história humana, como ele vai a longas distancias para alcançar aqueles a quem ama.", "correct": "C"}, {"letter": "c", "text": "Alguém já disse que “a mulher foi tirada da cabeça do homem para governar sobre ele, mas do seu lado, de sob seu braço, para ser protegida, e de perto do seu coração, para ser amada\".", "correct": "E"}, {"letter": "d", "text": "O livro de Êxodo se inicia com a criação do homem, no Éden, termina com os filhos de Israel olhando para o interior de um caixão de defunto, no Egito – não, porém, sem a promessa de que um dia todos sairiam de lá.", "correct": "E", "uncertain": true}]}, {"n": 9, "type": "ce", "instruction": "Marque “C” para as alternativas corretas e “E” para as alternativas incorretas.", "parts": [{"letter": "a", "text": "O segundo dia. O Senhor criou a terra e o reino vegetal. Deus continua a dar forma ao mundo, pelo processo de diferenciação.", "correct": "E"}, {"letter": "b", "text": "O primeiro dia. Disse Deus: Haja luz. Com facilidade incrível e ação deliberada, o Deus onipotente criou a luz.", "correct": "C"}, {"letter": "c", "text": "O quinto dia. Criação dos animais terrestre e das pessoas. 1°. As criaturas brutas: animais domésticos e selvagens Gn 1.24-31; 2.7-20.", "correct": "E"}, {"letter": "d", "text": "O quarto dia. A criação do sol, da lua, e das estrelas. Uma vez mais a descrição é geocêntrica, sem nenhum constrangimento.", "correct": "C"}]}, {"n": 10, "type": "ce", "instruction": "Marque “C” para as alternativas corretas e “E” para as alternativas incorretas. Três marcos na vida de Abraão; ( Gn 12.1-3,8 )", "parts": [{"letter": "a", "text": "As promessas.", "correct": "C"}, {"letter": "b", "text": "A tenda.", "correct": "C"}, {"letter": "c", "text": "O Altar.", "correct": "C"}, {"letter": "d", "text": "Se fosse possível classificar a Bíblia e dividir as suas partes em grau de importância, para todos os povos e nações, por tradição os judeus diriam que sua parte mais importante e fundamental seria o Pentateuco.", "correct": "C"}]}]}, {"num": "03", "title": "LIVROS HISTÓRICOS", "questions": [{"n": 1, "type": "ce", "instruction": "Marque “C” para as questões corretas e “E” para as questões erradas.", "parts": [{"letter": "a", "text": "O livro de Josué, parte de onde Moisés parou os registros em Deuteronômio.", "correct": "C"}, {"letter": "b", "text": "É provável que Josué tenha começado a comandar a Israel com a idade de 89 anos.", "correct": "E"}, {"letter": "c", "text": "Moises tirou da escravidão o povo de Deus. E Josué conduziu à terra da promessa.", "correct": "C"}, {"letter": "d", "text": "Moralmente, as pessoas eram depravadas; a anarquia e a brutalidade eram comuns.", "correct": "C"}]}, {"n": 2, "type": "ce", "instruction": "Marque “C” para as questões corretas e “E” para as questões erradas.", "parts": [{"letter": "a", "text": "O povo de Israel estava sem pátria por mais de quatrocentos anos (Gn 15.13).", "correct": "C"}, {"letter": "b", "text": "Israel ficou perambulando sem rumo no deserto por mais de quarenta anos.", "correct": "C"}, {"letter": "c", "text": "O livro de Josué é chamado de profetas anteriores.", "correct": "E", "uncertain": true}, {"letter": "d", "text": "Josué tinha sido um auxiliar achegado e amigo fiel de Moisés durante os quarenta anos da peregrinação de Israel no deserto (Êx 17.18; 24.13; 32.17-19; Nm 13.8-16)", "correct": "C"}]}, {"n": 3, "type": "ce", "instruction": "Marque “C” para as questões corretas e “E” para as questões erradas.", "parts": [{"letter": "a", "text": "Um dos aspectos da natureza de Cristo revelada em Josué é o da promessa cumprida.", "correct": "C"}, {"letter": "b", "text": "Deus, em sua graça e fidelidade, sustentou e preservou seu povo tirando-os do deserto e levando-os à terra prometida.", "correct": "C"}, {"letter": "c", "text": "Josué disse o que Israel deveria fazer (24.14-24).", "correct": "C"}, {"letter": "d", "text": "Ele não fará o mesmo por nós através de Cristo, que é a promessa.", "correct": "E"}]}, {"n": 4, "type": "ce", "instruction": "Marque “C” para as questões corretas e “E” para as questões erradas.", "parts": [{"letter": "a", "text": "Os juízes, a quem o senhor escolheu e ungiu com o seu Espírito, eram militares, civis e Eclesiastes.", "correct": "E"}, {"letter": "b", "text": "Canaã, liderada por Josué, registrando as condições em Canaã durante o período dos juízes, mas também antecipa o estabelecimento da monarquia em Israel.", "correct": "C"}, {"letter": "c", "text": "Antes da conquista de Jerusalém por Davi, tem o apoio de dois fatos: As palavras “naqueles dias, não havia rei em Israel”(17.6). A declaração de que “os jebuseus habitaram com os filhos de Benjamim em Jerusalém até ao dia de hoje” (1.21)", "correct": "C"}, {"letter": "d", "text": "O livro de Juízes, descrevem os caminhos rebeldes de Israel na terra Prometida e mostram como o senhor se relacionou com a nação naquele período.", "correct": "C"}]}, {"n": 5, "type": "ce", "instruction": "Marque “C” para as questões corretas e “E” para as questões erradas. O livro de Juízes registra quatro ciclos principais da apostasia de Israel, a saber:", "parts": [{"letter": "a", "text": "A tendência natural do povo de Deus.", "correct": "C"}, {"letter": "b", "text": "A história da salvação retrata o povo crente como um povo que não procura aprender.", "correct": "C"}, {"letter": "c", "text": "A rebelião e a incredulidade são coisas graves.", "correct": "C"}, {"letter": "d", "text": "Deus é um Deus misericordioso.", "correct": "C"}]}, {"n": 6, "type": "ce", "instruction": "Marque “C” para as questões corretas e “E” para as questões erradas:", "parts": [{"letter": "a", "text": "Deus sempre faculta um novo começo pela graça, mediante a nossa fé.", "correct": "C"}, {"letter": "b", "text": "Israel como um todo afastou-se da obediência sincera à palavra de Deus, e a tribo de Benjamim não afundou na apostasia total.", "correct": "E"}, {"letter": "c", "text": "Aparentemente, o propósito final do livro de juízes é ilustrar as consequências da apostasia e anarquia nos dias em que “não havia rei em Israel”.", "correct": "C"}, {"letter": "d", "text": "Ao recusar-se a castigar esses membros iníquos do seu grupo, a tribo inteira demonstrou: que a justiça nada valia para eles, e que perdera toda a sensibilidade moral e a lealdade à lei de Deus.", "correct": "C"}]}, {"n": 7, "type": "ce", "instruction": "Marque “C” para as questões corretas e “E” para as questões erradas.", "parts": [{"letter": "a", "text": "Boaz não (comprou) as terras da família que Noemi vendera, e as restituiu à linhagem de Elimeleque.", "correct": "E"}, {"letter": "b", "text": "Os episódios relatados no livro de Rute se passaram durante o período de juízes.", "correct": "C"}, {"letter": "c", "text": "Boaz representa uma das mais dramáticas figuras do AT que antecipa a obra redentora de Jesus.", "correct": "C"}, {"letter": "d", "text": "As ações de Boaz efetuam a participação de Rute nas benção de Israel, mas não incluem na linhagem familiar do Messias.", "correct": "E"}]}, {"n": 8, "type": "ce", "instruction": "Marque “C” para as questões corretas e “E” para as questões erradas.", "parts": [{"letter": "a", "text": "Israel havia sido governado por juízes ate que Deus levantou um homem chamado Samuel em momentos cruciais da história da nação.", "correct": "C"}, {"letter": "b", "text": "Em meio a essa confusa política religiosa surge Samuel, o milagroso filho de Ana.", "correct": "C"}, {"letter": "c", "text": "O templo de Siló fora profanado e o sacerdócio se mostra corrupto e imoral.", "correct": "C"}, {"letter": "d", "text": "O livro de Samuel “engloba sua vida e ministério até sua morte”.", "correct": "C"}]}, {"n": 9, "type": "ce", "instruction": "Marque “C” para as questões corretas e “E” para as questões erradas.", "parts": [{"letter": "a", "text": "II Reis retoma a história trágica do “reino dividido” quando Acazias está no trono de Israel e Josafá governando sobre Judá.", "correct": "C"}, {"letter": "b", "text": "I Reis; O autor ora está falando do reino do norte, Israel, ora do reino do sul, Judá, traçando simultaneamente suas histórias.", "correct": "C"}, {"letter": "c", "text": "A antiga tradição judaica do Talmude declara que Jeremias tenha escrito Reis.", "correct": "C"}, {"letter": "d", "text": "Esse famoso profeta pregou em Jerusalém só depois da sua queda.", "correct": "E"}]}, {"n": 10, "type": "ce", "instruction": "Marque “C” para as questões corretas e “E” para as questões erradas.", "parts": [{"letter": "a", "text": "Os dois últimos capítulos de I Crônicas recordam os últimos dias de Davi.", "correct": "C"}, {"letter": "b", "text": "O próprio Esdras era um sacerdote, um “escriba das palavras, dos mandamentos do SENHOR”.", "correct": "C"}, {"letter": "c", "text": "Amã manipula o rei para que execute os judeus.", "correct": "C"}, {"letter": "d", "text": "Ester arriscou sua vida por amor do seu povo.", "correct": "C"}]}]}, {"num": "04", "title": "LIVROS POÉTICOS", "questions": [{"n": 1, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "De modo geral, não é uma verdade que a educação diligente de pais piedosos influencie os filhos a seguirem nessa linha nos anos posteriores.", "correct": "E"}, {"letter": "b", "text": "O livro de Provérbios tem os seguintes títulos: (em hebraico): Shir ha-shirim, um superlativo absoluto que poderíamos chamar de \"Cantíssimo\". *Título na Septuaginta: Asma Asmaton. *Título em Latim: Canticum Canticorum. *Em Português: Cântico dos Cânticos ou Cantares.", "correct": "E"}, {"letter": "c", "text": "A poesia, especialmente na forma de cântico ou hino, ocupa um importante lugar na literatura dos Hebreus.", "correct": "C"}, {"letter": "d", "text": "Os exilados da Babilônia eram insistentemente convidados por seus captores que entoassem suas canções, sobre cuja fama devem ter ouvido (Sl 137:3).", "correct": "C"}]}, {"n": 2, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "O salmo 23 fala do Senhor como Pastor que, conduz nossas vidas sempre um caminho seguro e protegido.", "correct": "C"}, {"letter": "b", "text": "A sunamita não é uma moça modesta. \"Sou apenas um açafrão da planície costeira\", diz ela. Seu amado pastor a julga incomparável: \"Como lírio entre as plantas espinhosas, assim é minha companheira entre as filhas\"2:1-2.", "correct": "E"}, {"letter": "c", "text": "A sunamita relembra o tempo em que seu pastor respondeu à sua chamada e a convidou a passear nas colinas na primavera, Ct 2:3-3:5.", "correct": "C"}, {"letter": "d", "text": "Salomão escreveu três mil provérbios e foram seus cânticos mil e cinco (1 RS 4.32).", "correct": "C"}]}, {"n": 3, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Quando a rainha de Sabá viu a sabedoria e a prosperidade de Salomão, ela disse: \"Não se me contou nem mesmo a metade\".", "correct": "C"}, {"letter": "b", "text": "O livro de Eclesiastes é um monologo dramático, apresentando as complicadas experiências da vida; estas vozes estão em conflito, porem representam ou retratam o conflito de uma simples alma em guerra consigo mesma.", "correct": "C"}, {"letter": "c", "text": "Cantares de Salomão diz que o mundo inteiro não era digno do dia em que este sublime Cântico foi dado a Israel.", "correct": "C", "uncertain": true}, {"letter": "d", "text": "Deus realmente pune o nosso pecado, mais há muitas pessoas que sofrem sem que a causa seja exatamente esta.", "correct": "C"}]}, {"n": 4, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Uma das características mais edificantes do Livro dos Salmos é sua visão em Deus. Há momentos em que os salmos falam de dor, de tristeza, de dúvida, de inimigos, de perigos, mas há também os salmos que falam de alegria, de conforto, de certeza, de comunhão.", "correct": "C"}, {"letter": "b", "text": "Os salmistas são pessoas que tem comunhão com Deus e mostram todo o seu relacionamento em forma de palavras.", "correct": "C"}, {"letter": "c", "text": "No livro de Cantares, o acróstico da fase final faz uma descrição clássica da esposa capaz.", "correct": "E"}, {"letter": "d", "text": "Salmos de confiança (33, por exemplo). Estes salmos fazem afirmações fortes de confiança pessoal em Deus.", "correct": "E"}]}, {"n": 5, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Salmos de lamento. Uma maior dimensão da adoração israelita foi o lamento, aspecto ausente muitas vezes nos cultos modernos, a despeito do profundo senso de estar ferido ou em agonia levado aos cultos por muitas pessoas.", "correct": "C"}, {"letter": "b", "text": "Eliú não é o teólogo jovem do tipo que se acha ter todas as respostas.", "correct": "E"}, {"letter": "c", "text": "Portanto, os salmos 10 e 71 podem ser atribuídos a Davi, o salmo 43, aos filhos de Coré, e o salmo 91, a Moisés.", "correct": "C"}, {"letter": "d", "text": "Elifaz não se mostra um místico, afirmando ter recebido seu argumento de \"um espírito\" em \"visões noturnas\".", "correct": "E"}]}, {"n": 6, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas:", "parts": [{"letter": "a", "text": "No Israel antigo, as pessoas não se dedicavam somente a obter a sabedoria, como também a ensinar outras pessoas a obtê-la.", "correct": "C"}, {"letter": "b", "text": "Alguns afirmam que num conjunto de escritos, tal como os Salmos que abarcam muitos séculos, não se pode esperar nenhum sistema uniforme.", "correct": "C"}, {"letter": "c", "text": "Alguns não foram inspirados por Deus para ajudar a escrever porções do Antigo Testamento.", "correct": "E"}, {"letter": "d", "text": "Sabedoria é uma categoria de literatura que não é familiar à maioria dos cristãos atuais.", "correct": "C"}]}, {"n": 7, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Alguns expositores preferem dividir os salmos em categorias baseadas tanto nos temas tratados neles como na sua aplicação atual.", "correct": "C"}, {"letter": "b", "text": "Há índices que o Salmo 119 talvez fosse escrito pelo jovem príncipe Ezequias.", "correct": "C"}, {"letter": "c", "text": "Visto que Davi compôs muitos deles e organizou os músicos levitas em 24 grupos de serviço, é razoável concluir que ele tenha começado uma coleção desses cânticos a não serem usados no santuário.", "correct": "E"}, {"letter": "d", "text": "Compilação de 150 cânticos sagrados, muitos deles baseados nas experiências pessoais de Davi e de outros que não foram servos de Deus.", "correct": "E"}]}, {"n": 8, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Todo o livro de Eclesiastes, Salomão começou com uma avaliação negativista da vida como vaidade, algo irrelevante, mas no fim ele concluiu com sábio conselho, a indicar onde se pode encontrar o sentido da vida.", "correct": "C"}, {"letter": "b", "text": "Salomão não congratula os mortos, porque estão livres de \"todos os atos de opressão que se praticam debaixo do sol\".", "correct": "E"}, {"letter": "c", "text": "Os provérbios encorajam os pais a que cumpram com diligencia suas responsabilidades, confiando o futuro na graça e na soberania de Deus.", "correct": "C"}, {"letter": "d", "text": "A rainha diz ao rei Salomão pode ficar com a sua riqueza! Ela se contenta com seu único vinhedo, pois ama alguém que lhe é exclusivamente querido.", "correct": "E", "uncertain": true}]}, {"n": 9, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Deus o inspirou a compor este cântico para o proveito dos leitores da Bíblia e das eras futuras.", "correct": "C"}, {"letter": "b", "text": "Salomão retorna com grande pompa a Jerusalém, e o povo admira o seu cortejo. Nessa hora cruciante, o amado pastor abandona a sunamita.", "correct": "E"}, {"letter": "c", "text": "O rei Salomão se aproxima da sunamita. Novamente lhe diz quão bela ela é, mais bela do que \"sessenta rainhas e oitenta concubinas\" e ela não o rejeita.", "correct": "E"}, {"letter": "d", "text": "Um simples olhar dele para ela faz o coração dele bater mais rápido. Suas expressões de afeto são melhores do que o vinho, sua fragrância é como uma fragrância do Líbano e a sua pele é como um paraíso de romãs.", "correct": "C"}]}, {"n": 10, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "O livro de cantares termina com um convite da sunamita ao seu amado, lembrando os primeiros dias felizes de vida em comum.", "correct": "C"}, {"letter": "b", "text": "A sunamita relembra ter conhecido seu amado debaixo de uma macieira e declara o seu inquebrável amor por ele.", "correct": "C"}, {"letter": "c", "text": "As amistosas mulheres de Jerusalém os encorajam, dizendo: \"Comei, companheiros! Bebei e embriagai-vos com expressões de afeto!\"", "correct": "C"}, {"letter": "d", "text": "Ela o revê subir os montes pulando de alegria. A sunamita o ouve gritar para ela: \"Levante, vem, ó companheira minha, minha bela, e vem\".", "correct": "C"}]}]}, {"num": "05", "title": "PROFETAS MAIORES", "questions": [{"n": 1, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "A nossa atuação deve ser de expectativa e esperança.", "correct": "C"}, {"letter": "b", "text": "A Súplica de Daniel pela restauração de Israel.", "correct": "C"}, {"letter": "c", "text": "Todos os seres humanos pertencerão a duas categorias básicas: os salvos e os perdidos.", "correct": "C"}, {"letter": "d", "text": "Não devemos saber esperar o que Deus prometeu.", "correct": "E"}]}, {"n": 2, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Tanto Jeremias como Isaías não levaram mensagens de condenação ao povo de Israel que abandonaram a verdadeira fé.", "correct": "E"}, {"letter": "b", "text": "A visão do vale de ossos simboliza a morte nacional de Israel e a sua ressurreição futura, quando os reinos de Judá e Israel estiverem unidos, e a nação inteira ligada a Jeová por um pacto eterno.", "correct": "C"}, {"letter": "c", "text": "A visão de Daniel do homem vestido de linho que trouxe consolação.", "correct": "C"}, {"letter": "d", "text": "Saiba que os maiores bens que possuímos é sermos barro, ou seja, a matéria prima que o senhor quer usar.", "correct": "C"}]}, {"n": 3, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "A chamada de Ezequiel foi precedida por uma visão da gloria do Senhor. E sua mensagem foi de condenação a um povo desobediente.", "correct": "C"}, {"letter": "b", "text": "A aparição, as dores e a glória do Messias. Jesus, o Messias, o Servo de Deus, cumpriria com perfeição à vontade de Deus e por isso seria grandemente exaltado (At.2.33; Fp 2.9; Cl 3.1; Hb 1.3; 8.1.)", "correct": "C"}, {"letter": "c", "text": "Além de pregar mensagens Isaías dramatizava suas mensagens: a. Colocou nome simbólico de suas mensagens principais sobre seus filhos (7.3 e 8.3). b. Levou consigo o seu filho de nome profético ao encontro do rei para intensificar o peso da mensagem falada (7.3). c. Tomou uma tabua grande e escreveu nela em caracteres legíveis uma mensagem para criar curiosidade e fazer conhecer a mensagem (8.1-2) d. Em certa ocasião andava nu e descalço pela cidade por três anos como sinal e portanto contra a confiança política falsa no Egito e na Etiópia (20.3).", "correct": "E", "uncertain": true}, {"letter": "d", "text": "A restaurada comunidade israelita: as preparações de Israel para a época messiânica (40-48). a. O novo templo (40.1; 44.8) b. Os deveres dos sacerdotes (44.9-31) c. Os deveres do príncipe (45-46) d. O rio da vida que ocorrerá quando Israel tiver cumprido os planos divinos (47).", "correct": "C"}]}, {"n": 4, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "A função de Jeremias não era advertir o seu povo e as nações sobre a necessidade de arrependimento e mudança de vida.", "correct": "E"}, {"letter": "b", "text": "O verso 5 mostra como Deus vocacionou Jeremias. Ele precisa de servos ainda hoje.", "correct": "C"}, {"letter": "c", "text": "A missão de Ezequiel não é renovada. Depois que Jerusalém foi tomada, ele pode falar claramente em vez de pregar por meio de sinais e símbolos. Os falsos profetas são repreendidos.", "correct": "E"}, {"letter": "d", "text": "Jeremias teve a responsabilidade em manter viva a chama da esperança. O desafio era maior para ele porque havia muitos falsos profetas que anunciavam uma mensagem agradável aos ouvidos de sua geração sofrida.", "correct": "C"}]}, {"n": 5, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Muitas das visões de Jeremias são cenas do cotidiano, cenas comuns que passariam despercebidas aos olhos de qualquer um.", "correct": "C"}, {"letter": "b", "text": "A visão sobre um Carneiro e um Bode (550/49 a.C.): segundo os versos 20 e 212 o carneiro com dois chifres representa os reis da Média e da Pérsia enquanto o Bode representa o rei da Grécia (Alexandre), o chifre grande entre os olhos é o primeiro rei Alexandre.", "correct": "C"}, {"letter": "c", "text": "Os sonhos e projetos que ele tinha feito para sua nação começavam a desmoronar porque o Senhor lhe ordenara anunciar aos reis e ao povo que haveria de executar a sua justiça sobre eles. Sim Jeremias não estava frustrado.", "correct": "E"}, {"letter": "d", "text": "Sabedoria Mundana X Sabedoria Celestial: Daniel interpreta a visão de Nabucodonosor referente a grande estátua (o capítulo 2).", "correct": "C"}]}, {"n": 6, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas:", "parts": [{"letter": "a", "text": "Nos capítulos 58 a 66 – o pensamento principal não é o estabelecimento do reino universal de Deus e seu triunfo sobre toda forma do mal.", "correct": "E"}, {"letter": "b", "text": "O capítulo 61 descreve a dupla missão do Messias.", "correct": "C"}, {"letter": "c", "text": "A mensagem de Isaías gira em torno de três grandes temas: Deus e sua obra; Deus e o Povo Pecador; Deus e o messianismo.", "correct": "C"}, {"letter": "d", "text": "O rei celeste tem um representante na terra.", "correct": "C"}]}, {"n": 7, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Deus tem o controle absoluto sobre o seu povo da mesma maneira, e dirige o seu destino de acordo com seus planos.", "correct": "C"}, {"letter": "b", "text": "A Soberba de Nabucodonosor X A Soberania de Deus: Daniel interpreta o sonho de Nabucodonosor sobre a grande árvore cortada até a sua cepa; o rei fora de si, é expulso do meio dos homens até aprender que o Altíssimo tem domínio sobre o reino dos homens.", "correct": "C"}, {"letter": "c", "text": "Relativamente às condições políticas, morais e religiosas de Jerusalém e de Judá nos tempos de Isaías, temos notícias abundantes em 2 Rs. 15-20 e 2 Crôn. 26-32, além das reflexões do presente livro.", "correct": "C"}, {"letter": "d", "text": "A vontade de Deus era que a nação de Judá correspondesse à palavra escrita pela renuncia a seus maus caminhos e recebimento do perdão, e assim evitasse o juízo divino por causa da sua iniquidade (vv. 3,6,7).", "correct": "C"}]}, {"n": 8, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Os judeus ainda hoje usam este livro para exprimir o seu pesar pelo sofrimento e dispersão de Israel.", "correct": "C"}, {"letter": "b", "text": "O oleiro não desiste não se desespera. Determinado em sua tarefa, não insiste no trabalho.", "correct": "E"}, {"letter": "c", "text": "Podemos resumir o conteúdo deste livro na apresentação das desolações de Jerusalém, o resultado de seus pecados e o castigo de um Deus fiel, que visava conduzi-los ao arrependimento.", "correct": "C"}, {"letter": "d", "text": "Jeremias ficou impressionado com o controle que o oleiro tinha sobre o barro.", "correct": "C"}]}, {"n": 9, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "A humanidade será dividida em duas partes.", "correct": "C"}, {"letter": "b", "text": "Daniel recebeu revelação da \"escritura da, verdade\" (10.21) e é esta que deve normatizar nossa esperança e compreensão do presente e do futuro.", "correct": "C"}, {"letter": "c", "text": "Cada um de nós deve transformar sua \"fornalha\" em lugar de testemunho. Esta é uma mensagem para aqueles que trabalham em ambientes que cobram o testemunho vibrante.", "correct": "C"}, {"letter": "d", "text": "Não se pode mudar aquilo que Deus estabeleceu: isto não é determinismo, mas é a soberania de Deus.", "correct": "C"}]}, {"n": 10, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "A missão de Ezequiel é renovada. Depois que Jerusalém foi tomada, ele pode falar claramente em vez de pregar por meio de sinais e símbolos.", "correct": "C"}, {"letter": "b", "text": "Ezequiel corta o cabelo para simbolizar a destruição do povo de Jerusalém por fome, pestilência e espada.", "correct": "C"}, {"letter": "c", "text": "A glória de Jeová volta a habilitar no templo milenial do qual encontramos uma descrição detalhada nos capítulos 40 a 48.", "correct": "C"}, {"letter": "d", "text": "A maioria dos estudiosos conservadores admite que Ezequiel estivesse no exílio durante todo o seu ministério.", "correct": "C"}]}]}, {"num": "06", "title": "PROFETAS MENORES", "questions": [{"n": 1, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "O Senhor preparará a vitória final do seu povo sobre o ímpios.", "correct": "C"}, {"letter": "b", "text": "O dia do julgamento é uma realidade decretada por Deus e dele os injustos não escaparão (soberbos e ímpios).", "correct": "C"}, {"letter": "c", "text": "Devemos evitar a maledicência entre nós que servimos ao Senhor, pois ele está atento às nossas ações.", "correct": "C"}, {"letter": "d", "text": "Os dízimos serviriam para a manutenção da casa de Deus e habitavam os homens a fazerem prova de Deus.", "correct": "C"}]}, {"n": 2, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "O povo foi acusado de quebrar o pacto dos seus antepassados no aspecto de agir de modo indigno nas questões ligadas à família.", "correct": "C"}, {"letter": "b", "text": "Os homens que não devolvem os dízimos (que pertencem a Deus) ou não contribuem para as ofertas alçadas, são ladrões.", "correct": "C"}, {"letter": "c", "text": "O povo tem enfadado a Deus pelas suas palavras.", "correct": "C"}, {"letter": "d", "text": "Deus pediu a Jonas, o profeta, para levantar-se e ir 1500km para o oriente, e Nínive, uma cidade dos temidos e odiados assírios.", "correct": "E"}]}, {"n": 3, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "O livro de Miquéias, ainda falta à bela ordem de Amós.", "correct": "C"}, {"letter": "b", "text": "Deus não escolhe falar aos seus servos através de um mensageiro.", "correct": "E"}, {"letter": "c", "text": "Joel não profetizou numa época de grande devastação de toda a terra de Judá.", "correct": "E"}, {"letter": "d", "text": "Se Jonas escreveu o livro que leva o seu nome, o mesmo seria, obviamente, datado durante o reinado de Jeroboão II.", "correct": "C"}]}, {"n": 4, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Israel havia semeado o vento do pecado e da idolatria; agora, ceifaria as tormentas das investidas assírias.", "correct": "C"}, {"letter": "b", "text": "A infidelidade de Israel para com o Senhor está descrita por Oséias em termo de uma esposa que voltou as costas para o marido fiel.", "correct": "C"}, {"letter": "c", "text": "O nome Oséias significa suplantador.", "correct": "E"}, {"letter": "d", "text": "A falta do conhecimento pessoal de Deus destruía os israelitas.", "correct": "C"}]}, {"n": 5, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Amós não começa com uma série de acusações contra sete vizinhos de Israel.", "correct": "E"}, {"letter": "b", "text": "O livro de Amós não é basicamente uma mensagem de julgamento.", "correct": "E"}, {"letter": "c", "text": "O livro de Jonas, embora tenha sido colocado entre os profetas do Cânon, não é diferente dos outros livros proféticos.", "correct": "E"}, {"letter": "d", "text": "Miquéias não profetizou sob os mesmos monarcas que Isaías.", "correct": "E"}]}, {"n": 6, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas:", "parts": [{"letter": "a", "text": "Naum, cujo nome significa \"confortador\" ou \"cheio de conforto\", não é desconhecido, a não ser pelo breve titulo que inicia sua profecia.", "correct": "E"}, {"letter": "b", "text": "Duas referencias a Cristo no livro do Ageu são destacadas.", "correct": "C"}, {"letter": "c", "text": "Obadias é o menor livro do antigo testamento.", "correct": "C"}, {"letter": "d", "text": "Apesar do seu histórico não profissional, Amós foi chamado para entregar a mensagem de Deus ao reino do Norte, Israel.", "correct": "C"}]}, {"n": 7, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Os dois irmãos gêmeos Esaú e Jacó não se dividiram em disputa.", "correct": "E"}, {"letter": "b", "text": "Um triste comentário de Zacarias 7.12 não recorda ao povo sua rebelião contra as palavras do Senhor dos profetas.", "correct": "E"}, {"letter": "c", "text": "Por causa da rebelião do povo, Deus lhe enviaria doenças e enfermidades.", "correct": "C"}, {"letter": "d", "text": "Uma vez Oséias usa a frase \"o espírito de luxuria\", e uma vez, \"o espírito da prostituição\".", "correct": "C"}]}, {"n": 8, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Os ensinamentos de Paulo acerca de Cristo como o Noivo e a igreja como a Noiva não correspondem à cerimônia de casamento.", "correct": "E"}, {"letter": "b", "text": "Deus não atenderia à oração de Israel, até que este reconhecesse sua culpa, aceitasse o castigo e buscasse com sinceridade a ajuda divina.", "correct": "C"}, {"letter": "c", "text": "Construção de altares, no Norte de Israel, foi ordem de Deus.", "correct": "E"}, {"letter": "d", "text": "O argumento dos vaticínios de Miquéias é, portanto, semelhante aos de Isaías.", "correct": "C"}]}, {"n": 9, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Deus manda uma tempestade para golpear o navio e causar circunstancia que conduzem Jonas ao seu chamado missionário.", "correct": "C"}, {"letter": "b", "text": "Finalmente, Amós não promete restauração para Israel.", "correct": "E"}, {"letter": "c", "text": "O profeta não vê um tempo futuro, \"depois\", quando o Espírito de Deus for derramado \"sobre toda a carne\".", "correct": "E"}, {"letter": "d", "text": "Então, os endomitas juntaram-se aos babilônios contra seus parentes e ajudaram a profanar a terra de Israel.", "correct": "C"}]}, {"n": 10, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "No livro de Jonas, pode ser encontrada a semente do farisaísmo do Novo Testamento.", "correct": "C"}, {"letter": "b", "text": "O tema central do livro de Amós é que o povo de Israel havia quebrado seu concerto com Deus.", "correct": "C"}, {"letter": "c", "text": "À medida que o jovem Josias foi tomando conta das rédeas do governo, a ameaça assíria não foi diminuindo.", "correct": "E"}, {"letter": "d", "text": "Ageu não levou uma mensagem destinada a tratar decisivamente do desencorajamento.", "correct": "E"}]}]}, {"num": "07", "title": "TEOLOGIA PASTORAL", "questions": [{"n": 1, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "É prova de sabedoria colocar novos convertidos em posição de liderança.", "correct": "E"}, {"letter": "b", "text": "Uma pessoa sóbria mostra-se tranquila e calma em seu juízo, bem como clara em sua maneira de pensar e em sua perspectiva.", "correct": "C"}, {"letter": "c", "text": "Os conceitos de liderança são desenvolvidos a partir dos padrões estabelecidos para anciões ou bispos, supervisores e os diáconos.", "correct": "C"}, {"letter": "d", "text": "As palavras “homens de boa reputação” referem-se a homens sobre quem não se podia testificar favoravelmente, cujas vidas vinham sendo observadas pelos demais crentes.", "correct": "E"}]}, {"n": 2, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "“Então enquanto temos oportunidade, façamos o mal a todos, mas principalmente aos domésticos da fé.” Gl 6:10.", "correct": "E"}, {"letter": "b", "text": "“Vós servos, obedecei a vossos senhores segundo a carne, com temor e tremor, na sinceridade de vosso coração, como a Cristo”.", "correct": "C"}, {"letter": "c", "text": "Disse-lhe o seu Senhor: muito bem meu servo bom e fiel, sobre o pouco foste fiel, sobre o pouco te colocarei, entra no gozo do teu Senhor.”", "correct": "E"}, {"letter": "d", "text": "Os servos verdadeiros são fiéis ao seu ministério.", "correct": "C"}]}, {"n": 3, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "O pastor que não se importa com a comunicação, cria para si e para a igreja prejuízos.", "correct": "C"}, {"letter": "b", "text": "A comunicação entre o homem e Deus é a oração.", "correct": "C"}, {"letter": "c", "text": "A liderança do ministério deve ter por alvo a glória de Deus e não a vantagem pessoal do líder.", "correct": "C"}, {"letter": "d", "text": "Paulo deu esse conselho a seu discípulo, Timóteo: “Ora, é necessário que o servo do Senhor viva a contender, e não deve ser brando para com todos.”", "correct": "E"}]}, {"n": 4, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "Uma estratégia bem feita ajuda o pastor a ser paciente quando as coisas não vão bem.", "correct": "C"}, {"letter": "b", "text": "O bom líder desenvolve boa estratégia, logo, toda estratégia e composta de: Objetivos, Alvos, Prioridades, Planejamento e Diretrizes.", "correct": "C"}, {"letter": "c", "text": "Ética significa: estudo dos juízos de apreciação referentes à conduta humana suscetível de qualificação do ponto de vista do bem e do mal, seja relativamente à determinada sociedade, seja de modo absoluto.", "correct": "C"}, {"letter": "d", "text": "O obreiro precisa ser ético nos momento difíceis da sua vida. Tais como: ser transferido de uma igreja para a outra. Não ficar murmurando no púlpito, reclamando da liderança da igreja. Não sugerir que seu sucessor é menos qualificado que você.", "correct": "C"}]}, {"n": 5, "type": "ce", "instruction": "Marque \"C\" para as questões corretas e \"E\" para as questões erradas.", "parts": [{"letter": "a", "text": "O pastor não deve conformar com os padrões deste mundo.", "correct": "C"}, {"letter": "b", "text": "O pastor deve conformar com os padrões deste mundo.", "correct": "E"}, {"letter": "c", "text": "O pastor ético faz tudo para glória de Deus e para si próprio.", "correct": "E"}, {"letter": "d", "text": "O pastor ético faz tudo pela glória de Deus.", "correct": "C"}]}, {"n": 6, "type": "ce", "instruction": "Marque com \"X\" a(s) alternativa(s) correta(s).", "parts": [{"letter": "a", "text": "O Espírito Santo é a primeira pessoa da Trindade.", "correct": "E"}, {"letter": "b", "text": "Filho, Consolador Mt. 3:16 e 28:19.", "correct": "E"}, {"letter": "c", "text": "Ele é uma personalidade com quem podemos nos comunicar e nos familiarizar. Fp 2:1 e 2 Co 13:13.", "correct": "C"}, {"letter": "d", "text": "O Espírito Santo é a terceira pessoa da Trindade.", "correct": "C"}]}, {"n": 7, "type": "ce", "instruction": "Marque com \"X\" a(s) alternativa(s) correta(s).", "parts": [{"letter": "a", "text": "Fogo – Que limpa e refrigera At. 2:3/ Is 4:4/ Ex 13:21-22.", "correct": "E"}, {"letter": "b", "text": "Terra – Invisível, indescobrível, indispensável, dá vida, irresistível. At. 2:2.", "correct": "E"}, {"letter": "c", "text": "Água – Regenera limpa, da vida, dessedenta. Jo 7:38-39/ Is 44:3.", "correct": "C"}, {"letter": "d", "text": "Pomba – Purifica e refina. Mt 3:16-17/ Jo 1:32.", "correct": "E"}]}, {"n": 8, "type": "ce", "instruction": "Marque com \"X\" a(s) alternativa(s) correta(s).", "parts": [{"letter": "a", "text": "Glorifica a Cristo, não a si mesmo.", "correct": "C"}, {"letter": "b", "text": "Possui o espírito de ambição e é pacífico. Gl 6:1-2.", "correct": "E"}, {"letter": "c", "text": "Se envergonha de Jesus Cristo, não crê nele e nem fala dele. Rm 1:16", "correct": "E"}, {"letter": "d", "text": "Fala a verdade, não engana, não é hipócrita.", "correct": "C"}]}, {"n": 9, "type": "ce", "instruction": "Marque com \"X\" a(s) alternativa(s) correta(s).", "parts": [{"letter": "a", "text": "Pregação é a comunicação da verdade de Deus através de seu servo para satisfazer as necessidades das pessoas.", "correct": "C"}, {"l ramaica que significa “boas novas”.", "correct": "E"}]}, {"n": 2, "type": "ce", "instruction": "Marque “C” para as questões corretas e “E” para as questões erradas.", "parts": [{"letter": "a", "text": "Nenhuma das alternativas estão corretas.", "correct": "E"}, {"letter": "b", "text": "“Sinóticos”, são os evangelhos de Mateus, Marcos e Lucas, já que eles são coincidentes e estudados em conjunto.", "correct": "C"}, {"letter": "c", "text": "A palavra “Sinóticos” significa: construção paralela dos quatro evangelhos, porque suas seções são coincidentes e podem ser estudadas em conjunto.", "correct": "E"}, {"letter": "d", "text": "Mateus, Marcos e Lucas apresentam Jesus começando seu ministério depois de João batista.", "correct": "C"}]}, {"n": 3, "type": "match", "instruction": "Enumere a 2ª coluna de acordo com a primeira:", "left": [{"key": "1", "text": "A hipótese dos fragmentos."}, {"key": "2", "text": "A hipótese da tradição."}, {"key": "3", "text": "A hipótese da utilização."}, {"key": "4", "text": "A hipótese do evangelho originário."}], "right": [{"text": "Suposição de que existia uma dependência literária pela utilização comum do livro de Marcos.", "answerKey": "3"}, {"text": "Existe um evangelho originário, descrito em aramaico.", "answerKey": "4"}, {"text": "Oral e pré-literário que se tornou escrita por causa da necessidade da missão.", "answerKey": "2"}, {"text": "Junção de varias histórias de Jesus que foram recompiladas.", "answerKey": "1"}]}, {"n": 4, "type": "ce", "instruction": "Marque “C” para as questões corretas e “E” para as questões incorretas.", "parts": [{"letter": "a", "text": "Papias dizia que Mateus havia escrito seu evangelho a partir das memórias de Pedro.", "correct": "E"}, {"letter": "b", "text": "Um dito é aquela palavra de Jesus que não tem qualquer ligação com o contexto histórico ou literário conhecido.", "correct": "C"}, {"letter": "c", "text": "O propósito principal dos Evangelhos é mostrar os usos e costumes da igreja primitiva.", atch", "instruction": "Enumere a segunda coluna de acordo com a primeira:", "left": [{"key": "1", "text": "Leprosos."}, {"key": "2", "text": "Publicanos e pecadores."}, {"key": "3", "text": "Samaritanos."}, {"key": "4", "text": "O ladrão na cruz."}], "right": [{"text": "Lc 10.33.", "answerKey": "3"}, {"text": "Lc 17.12 – Narrativa exclusiva.", "answerKey": "1"}, {"text": "Lc 23.43 – Narrativa exclusiva.", "answerKey": "4"}, {"text": "Lc 17.12.", "answerKey": "2"}]}, {"n": 9, "type": "fill_multi", "instruction": "Indique a referencia bíblica dos textos seguintes:", "parts": [{"letter": "a", "prompt": "Parábola da Dracma perdida: Lucas __________ verso(s) ____________.", "answer": "15, versículo(s) 8-10", "uncertain": true}, {"letter": "b", "prompt": "Filhas de Jerusalém: Lucas __________ verso(s) ____________.", "answer": "23, versículo(s) 27"}, {"letter": "c", "prompt": "O choro de Jesus por Jerusalém: Lucas __________ verso(s) _________.", "answer": "19, versículo(s) 41-44", "uncertain": true}, {"letter": "d", "prompt": "Parábola do Filho Pródigo: Lucas __________ verso(s) ____________.", "answer": "15, versículo(s) 11-32", "uncertain": true}]}, {"n": 10, "type": "match", "instruction": "Enumere a segunda coluna de acordo com a primeira:", "left": [{"key": "1", "text": "FARISEUS"}, {"key": "2", "text": "SADUCEUS"}, {"key": "3", "text": "ESCRIBAS"}, {"key": "4", "text": "HERODIANOS"}, {"key": "5", "text": "ESSÊNIOS"}, {"key": "6", "text": "ZELOTES"}, {"key": "7", "text": "SINÉDRIO"}], "right": [{"text": "Rabinos, doutores e mestres da lei.", "answerKey": "3"}, {"text": "Superior tribunal dos Judeus.", "answerKey": "7"}, {"text": "Pertenciam a classe média leiga e faziam oposição ao helenismo na cultura Judaica.", "answerKey": "1"}, {"text": "Extremamente legalistas, viviam em comunidades monásticas e usavam roupas brancas, como símbolo da pureza pessoal.", "answerKey": "5"}, {"text": "Classe dos aristocratas, os quais tinham muita influencia política.", "answerKey": "2"}, {"text": "Apoiavam a dinastia dos Herodes e ao governo romano.", "answerKey": "4"}, {"text": "Revolucionários dedicados à derrubada do domínio romano.", "answerKey": "6"}]}]}, {"num": "13", "title": "ATOS DOS APÓSTOLOS", "questions": [{"n": 1, "type": "single", "instruction": "Marque com um \"X\" a afirmativa correta. Lucas deixou de exercer a medicina para acompanhar:", "parts": [{"letter": "a", "text": "João Marcos"}, {"letter": "b", "text": "Pedro"}, {"letter": "c", "text": "Barnabé"}, {"letter": "d", "text": "Paulo"}], "correctLetter": "d"}, {"n": 2, "type": "single", "instruction": "Marque com um \"X\" a afirmativa correta. O capitulo 27 de Atos descreve a viagem de Paulo a:", "parts": [{"letter": "a", "text": "Beréia"}, {"letter": "b", "text": "Roma"}, {"letter": "c", "text": "Antioquia"}, {"letter": "d", "text": "Pérgamo"}], "correctLetter": "b"}, {"n": 3, "type": "single", "instruction": "Marque com um \"X\" a afirmativa correta. O sermão de Pedro resultou na aceitação da palavra e batismo de quase:", "parts": [{"letter": "a", "text": "Três mil pessoas"}, {"letter": "b", "text": "Duas mil pessoas"}, {"letter": "c", "text": "Cinco mil pessoas"}, {"letter": "d", "text": "N.D.A"}], "correctLetter": "a"}, {"n": 4, "type": "fill", "instruction": "A cura de um coxo de nascença é registrada em qual capítulo do livro de Atos?", "answer": "Capítulo 3 (Atos 3:1-10)"}, {"n": 5, "type": "single", "instruction": "Marque com um \"X\" a afirmativa correta. Conforme At 3.17, o Apóstolo Pedro convida:", "parts": [{"letter": "a", "text": "Ao arrependimento e volta para Jesus."}, {"letter": "b", "text": "Fazerem penitencia, afim de serem perdoados."}, {"letter": "c", "text": "Fazer jejum, para mostrar arrependimento."}, {"letter": "d", "text": "N.D.A"}], "correctLetter": "a"}, {"n": 6, "type": "fill", "instruction": "Em qual capítulo esta relatada a morte de Ananias e Safira?", "answer": "Capítulo 5 (Atos 5:1-11)"}, {"n": 7, "type": "fill", "instruction": "A morte de Es vas erradas. Ao estudar o capítulo sobre período de aula aprendemos princípios que podem determinar o sucesso da aula como:", "parts": [{"letter": "a", "text": "Ao encerrar o período da aula é aconselhável que o professor estimule o interesse para a aula seguinte.", "correct": "C"}, {"letter": "b", "text": "O Espirito Santo é o grande motivador do professor e sem o seu auxilio não se pode atingir os alvos do ensino.", "correct": "C"}, {"letter": "c", "text": "Ao ensinar a lição, o professor deve seguir estritamente o seu plano de aula, para não correr risco de se desviar do assunto.", "correct": "E"}, {"letter": "d", "text": "No início da aula, a atmosfera de reverencia e adoração não são fundamentais, pois a mesma virá com o desenvolver da aula.", "correct": "E"}]}, {"n": 10, "type": "ce", "instruction": "Marque \"C\" para as alternativas corretas e \"E\" para as alternativas erradas. Para manter a atenção dos alunos e atingir seus objetivos é importante lembrar que:", "parts": [{"letter": "a", "text": "Ao deparar-se com problemas de disciplina, o professor deve buscar resolvê-lo, sabendo que eles sempre são provenientes do aluno e sua família.", "correct": "E"}, {"letter": "b", "text": "Para sustentar a atenção da classe, o assunto da aula deve se relacionar com os interesses do aluno.", "correct": "C"}, {"letter": "c", "text": "Uma das maneiras de conservar a atenção da turma é o professor demonstrar que ele próprio tem real interesse na lição.", "correct": "C"}, {"letter": "d", "text": "As distrações são o maior inimigo da atenção e podem se tornar um problema complexo.", "correct": "C"}]}]}];

let currentExam = null;
let answers = {};
let graded = false;

function goHome() {
  currentExam = null;
  graded = false;
  answers = {};
  render();
  window.scrollTo(0,0);
}

function openExam(num) {
  currentExam = EXAMS.find(e => e.num === num);
  graded = false;
  answers = {};
  render();
  window.scrollTo(0,0);
}

function render() {
  const app = document.getElementById('app');
  document.getElementById('header-subtitle').textContent = currentExam
    ? currentExam.title
    : 'Instituto Educacional e Teológico do Gama';
  if (!currentExam) {
    renderHome(app);
  } else {
    renderExam(app);
  }
}

function renderHome(app) {
  let html = `
    <div class="intro">
      <p>Escolha uma das 21 provas abaixo para responder. Ao final, clique em <strong>"Corrigir Prova"</strong>
      para ver sua pontuação e o gabarito completo com as respostas corretas.</p>
    </div>
    <div class="grid">
  `;
  EXAMS.forEach(exam => {
    html += `
      <div class="exam-card" onclick="openExam('${exam.num}')">
        <span class="num">Prova ${exam.num}</span>
        <h3>${escapeHtml(exam.title)}</h3>
        <div class="meta">${exam.questions.length} questões</div>
      </div>
    `;
  });
  html += `</div>`;
  app.innerHTML = html;
}

function escapeHtml(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function keyFor(qn, sub) {
  return sub !== undefined ? `${qn}__${sub}` : `${qn}`;
}

function renderExam(app) {
  const exam = currentExam;
  let html = `
    <div class="quiz-header">
      <h2>Prova ${exam.num} &mdash; ${escapeHtml(exam.title)}</h2>
      <div class="meta">${exam.questions.length} questões &middot; Marque suas respostas e clique em "Corrigir Prova" ao final.</div>
    </div>
  `;

  if (graded) {
    const result = gradeExam(exam);
    html += `
      <div class="score-banner">
        <div class="big">${result.correct} / ${result.total}</div>
        <div class="pct">${result.pct}% de acertos</div>
      </div>
    `;
  }

  exam.questions.forEach(q => {
    html += renderQuestion(exam, q);
  });

  html += `<div class="actions">`;
  if (!graded) {
    html += `<button class="btn" onclick="submitExam()">Corrigir Prova</button>`;
  } else {
    html += `<button class="btn secondary" onclick="retryExam()">Tentar Novamente</button>`;
    html += `<button class="btn" onclick="goHome()">Voltar ao Início</button>`;
  }
  html += `</div>`;

  app.innerHTML = html;
}

function renderQuestion(exam, q) {
  let inner = '';
  const uncertainQ = q.uncertain ? `<span class="uncertain-flag" title="Resposta pode necessitar revisão">verificar</span>` : '';

  if (q.type === 'ce') {
    inner = q.parts.map(p => renderCEItem(q, p)).join('');
  } else if (q.type === 'single') {
    inner = `<div class="single-options">` + q.parts.map(p => renderSingleOption(q, p)).join('') + `</div>`;
  } else if (q.type === 'fill') {
    inner = renderFill(q);
  } else if (q.type === 'fill_multi') {
    inner = q.parts.map(p => renderFillMultiPart(q, p)).join('');
  } else if (q.type === 'match') {
    inner = renderMatch(q);
  } else {
    inner = `<p><em>Tipo de questão não suportado: ${q.type}</em></p>`;
  }

  return `
    <div class="question">
      <div class="instruction"><span class="qnum">${q.n})</span>${escapeHtml(q.instruction)}${uncertainQ}</div>
      ${inner}
    </div>
  `;
}

function renderCEItem(q, p) {
  const k = keyFor(q.n, p.letter);
  const val = answers[k];
  let rowClass = 'item-row';
  let resultTag = '';
  if (graded) {
    const isCorrect = val === p.correct;
    rowClass += isCorrect ? ' correct' : ' incorrect';
    resultTag = isCorrect
      ? `<span class="result-tag ok">correto</span>`
      : `<span class="result-tag no">resposta certa: ${p.correct}</span>`;
    if (p.uncertain) resultTag += `<span class="uncertain-flag">verificar</span>`;
  }
  return `
    <div class="${rowClass}">
      <span class="item-letter">${p.letter})</span>
      <span class="item-text">${escapeHtml(p.text)}${resultTag}</span>
      <span class="ce-toggle">
        <button type="button" class="ce-btn c-btn ${val==='C'?'selected':''}" ${graded?'disabled':''} onclick="setAnswer('${k}','C')">C</button>
        <button type="button" class="ce-btn e-btn ${val==='E'?'selected':''}" ${graded?'disabled':''} onclick="setAnswer('${k}','E')">E</button>
      </span>
    </div>
  `;
}

function renderSingleOption(q, p) {
  const k = keyFor(q.n);
  const val = answers[k];
  const checked = val === p.letter ? 'checked' : '';
  let extra = '';
  if (graded) {
    if (p.letter === q.correctLetter) {
      extra = `<span class="result-tag ok">correta</span>`;
    } else if (val === p.letter) {
      extra = `<span class="result-tag no">sua resposta</span>`;
    }
  }
  return `
    <label>
      <input type="radio" name="${k}" value="${p.letter}" ${checked} ${graded?'disabled':''} onchange="setAnswer('${k}','${p.letter}')">
      <span><strong>${p.letter})</strong> ${escapeHtml(p.text)}</span>${extra}
    </label>
  `;
}

function renderFill(q) {
  const k = keyFor(q.n);
  const val = answers[k] || '';
  let note = '';
  if (graded) {
    note = `<div class="correct-answer-note">Resposta correta: ${escapeHtml(q.answer)}${q.uncertain ? ' <span class="uncertain-flag">verificar</span>' : ''}</div>`;
  }
  return `
    <input type="text" class="fill-input" placeholder="Sua resposta..." value="${escapeHtml(val)}" ${graded?'disabled':''} oninput="setAnswer('${k}', this.value)">
    ${note}
  `;
}

function renderFillMultiPart(q, p) {
  const k = keyFor(q.n, p.letter);
  const val = answers[k] || '';
  let note = '';
  if (graded) {
    note = `<div class="correct-answer-note">Resposta correta: ${escapeHtml(p.answer)}${p.uncertain ? ' <span class="uncertain-flag">verificar</span>' : ''}</div>`;
  }
  return `
    <div class="fill-part">
      <div class="prompt"><strong>${p.letter})</strong> ${escapeHtml(p.prompt)}</div>
      <input type="text" class="fill-input" placeholder="Sua resposta..." value="${escapeHtml(val)}" ${graded?'disabled':''} oninput="setAnswer('${k}', this.value)">
      ${note}
    </div>
  `;
}

function renderMatch(q) {
  let left = `<div class="match-left">` + q.left.map(l => `<div>(${l.key}) ${escapeHtml(l.text)}</div>`).join('') + `</div>`;
  let rights = q.right.map((r, idx) => {
    const k = keyFor(q.n, idx);
    const val = answers[k] || '';
    let options = `<option value="">-- selecione --</option>` + q.left.map(l => `<option value="${l.key}" ${val===l.key?'selected':''}>${l.key}</option>`).join('');
    let note = '';
    if (graded) {
      const isCorrect = val === r.answerKey;
      note = isCorrect
        ? `<span class="result-tag ok">correto</span>`
        : `<span class="result-tag no">resposta certa: ${r.answerKey}</span>`;
    }
    return `
      <label>
        <select class="match-select" ${graded?'disabled':''} onchange="setAnswer('${k}', this.value)">${options}</select>
        <span>( ) ${escapeHtml(r.text)}</span>${note}
      </label>
    `;
  }).join('');
  return left + `<div class="match-options">${rights}</div>`;
}

function setAnswer(key, val) {
  const current = answers[key];
  answers[key] = current === val ? undefined : val;
  if (answers[key] === undefined) delete answers[key];
  // For radio/select we always want to set (not toggle) - re-set explicitly
  answers[key] = val;
  render();
}

function submitExam() {
  graded = true;
  render();
  window.scrollTo(0,0);
}

function retryExam() {
  graded = false;
  answers = {};
  render();
  window.scrollTo(0,0);
}

function gradeExam(exam) {
  let total = 0, correct = 0;
  exam.questions.forEach(q => {
    if (q.type === 'ce') {
      q.parts.forEach(p => {
        total++;
        if (answers[keyFor(q.n, p.letter)] === p.correct) correct++;
      });
    } else if (q.type === 'single') {
      total++;
      if (answers[keyFor(q.n)] === q.correctLetter) correct++;
    } else if (q.type === 'match') {
      q.right.forEach((r, idx) => {
        total++;
        if (answers[keyFor(q.n, idx)] === r.answerKey) correct++;
      });
    }
    // fill / fill_multi are shown with the correct answer but not auto-graded
    // (free-text grading is unreliable), so they're excluded from the score.
  });
  const pct = total > 0 ? Math.round((correct/total)*100) : 0;
  return { correct, total, pct };
}

render();
</script>
